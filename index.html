<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Casa + Bonita | Maricá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #0056b3; --dark: #0b132b; }
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: var(--dark); color: white; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .photo-slot { border: 2px dashed #ccc; height: 100px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #fff; cursor: pointer; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; color: white; flex-direction: column; align-items: center; justify-content: center; }
        .prio-badge { font-size: 0.7rem; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner-border text-light mb-3"></div>
    <h5 id="loadTxt">Processando...</h5>
</div>

<nav class="navbar navbar-dark p-3 shadow">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand fw-bold">MINHA CASA + BONITA</span>
        <div>
            <button class="btn btn-sm btn-outline-light me-2" onclick="showView('Admin')">Admin</button>
            <button class="btn btn-sm btn-warning" onclick="showView('Form')">+ Nova Vistoria</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <!-- VISÃO FORMULÁRIO -->
    <div id="viewForm" class="view-section">
        <div class="card card-custom p-4">
            <h4 class="text-primary mb-4 border-bottom pb-2">Diagnóstico de Campo - Risca Faca</h4>
            <div class="row g-3">
                <div class="col-md-4"><label class="fw-bold small">ID Unidade</label><input type="text" id="f_unid" class="form-control" placeholder="RF-000"></div>
                <div class="col-md-8"><label class="fw-bold small">Nome do Morador</label><input type="text" id="f_nome" class="form-control"></div>
                <div class="col-12"><label class="fw-bold small">Endereço</label><input type="text" id="f_end" class="form-control"></div>
                <div class="col-12"><label class="fw-bold small">Prioridade</label>
                    <select id="f_prio" class="form-select">
                        <option value="MÁXIMA">URGENTE (Insalubridade)</option>
                        <option value="ALTA">ALTA</option>
                        <option value="MÉDIA">MÉDIA</option>
                    </select>
                </div>
            </div>

            <h5 class="mt-4 fw-bold small text-muted">REGISTRO FOTOGRÁFICO (16 FOTOS)</h5>
            <div class="row g-2" id="photoGrid"></div>

            <button class="btn btn-primary w-100 mt-4 py-3 fw-bold" onclick="finalizarVistoria()">SALVAR DIAGNÓSTICO ONLINE</button>
        </div>
    </div>

    <!-- VISÃO ADMIN -->
    <div id="viewAdmin" class="view-section" style="display:none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Dashboard Geral</h3>
            <button class="btn btn-sm btn-primary" onclick="loadAdminData()"><i class="fas fa-sync"></i> Atualizar</button>
        </div>
        <div class="card card-custom p-0 overflow-hidden text-center">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th>Cód</th>
                        <th>Morador</th>
                        <th>Prioridade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="adminBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- COLOQUE SEUS DADOS AQUI ---
    const CLOUD_NAME = "dn3bmndvk"; 
    const UPLOAD_PRESET = "bonita_preset"; 
    const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzPn9HO1gSVGUlAYXgyOzBqupgbB7rwNloWlG-RiOOY4Ax9oLlpvTY9V0lVUEu9F28C0A/exec";

    let fotosUrls = [];

    // Gerar Grid de Fotos
    const grid = document.getElementById('photoGrid');
    for(let i=1; i<=16; i++) {
        grid.innerHTML += `
            <div class="col-3 col-md-2">
                <div class="photo-slot" onclick="document.getElementById('f${i}').click()">
                    <i class="fas fa-camera text-muted"></i>
                    <input type="file" id="f${i}" hidden accept="image/*" onchange="uploadToCloudinary(this, ${i})">
                    <div id="prev${i}"></div>
                </div>
            </div>`;
    }

    function showView(v) {
        document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
        document.getElementById('view' + v).style.display = 'block';
        if(v === 'Admin') loadAdminData();
    }

    async function uploadToCloudinary(input, id) {
        const file = input.files[0];
        if(!file) return;

        document.getElementById('loadTxt').innerText = "Subindo foto " + id + "...";
        document.getElementById('loading').style.display = 'flex';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            fotosUrls.push(data.secure_url);
            document.getElementById('prev'+id).innerHTML = `<img src="${data.secure_url}">`;
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    async function finalizarVistoria() {
        document.getElementById('loadTxt').innerText = "Enviando dados para a Planilha...";
        document.getElementById('loading').style.display = 'flex';

        const payload = {
            unidade: document.getElementById('f_unid').value,
            morador: document.getElementById('f_nome').value,
            endereco: document.getElementById('f_end').value,
            prioridade: document.getElementById('f_prio').value,
            tecnico: "Equipe Campo",
            fotosLinks: fotosUrls.join(" | ")
        };

        await fetch(SHEETS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        alert("Vistoria RF concluída e salva!");
        location.reload();
    }

    async function loadAdminData() {
        const res = await fetch(SHEETS_URL);
        const data = await res.json();
        const tbody = document.getElementById('adminBody');
        tbody.innerHTML = data.map(row => `
            <tr>
                <td><b>${row[1]}</b></td>
                <td>${row[2]}</td>
                <td><span class="prio-badge ${row[4] === 'MÁXIMA' ? 'bg-danger text-white' : 'bg-warning'}">${row[4]}</span></td>
                <td><button class="btn btn-sm btn-dark" onclick="gerarPDF('${row[1]}','${row[2]}','${row[6]}')">PDF</button></td>
            </tr>
        `).join('');
    }

    function gerarPDF(unid, nome, links) {
        const fotosHtml = links.split(" | ").map(link => `<img src="${link}" style="width:23%; margin:5px; height:100px; object-fit:cover; border:1px solid #000">`).join("");
        const template = `<div style="padding:40px"><h2>MINHA CASA + BONITA - LAUDO</h2><p>Unidade: ${unid}</p><p>Morador: ${nome}</p><hr><div>${fotosHtml}</div></div>`;
        html2pdf().from(template).set({ margin: 10, filename: `Laudo_${unid}.pdf`, html2canvas: { scale: 2, useCORS: true } }).save();
    }
</script>
</body>
</html>
